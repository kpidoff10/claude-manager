<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>{% block title %}Signaler un problème{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ static_v }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🛟</text></svg>">
  {% block head %}{% endblock %}
</head>
<body class="support">
{# Espace signaleur : aucun lien vers le reste du manager. #}
<header class="support-top">
  <a class="brand" href="/support">🛟 Signaler un problème</a>
  {% if reporter %}
  <span class="muted small">{{ reporter.name }}{% if reporter.agency %} · {{ reporter.agency }}{% endif %}
    · <a href="/support/logout">Déconnexion</a></span>
  {% endif %}
</header>
<main class="support-main">
{% block content %}{% endblock %}
</main>
<script src="/static/support.js?v={{ static_v }}"></script>
</body>
</html>
